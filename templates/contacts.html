{% extends 'base.html' %}

{% block content %}
<div class="row g-4">
    <section class="col-md-5">
        <h2>Зв’язатися зі мною</h2>
        <p>Микола Угринюк</p>
        <p>
            GitHub:
            <a href="https://github.com/MykolaUhry">MykolaUhry</a>
        </p>
    </section>

    <section class="col-md-7">
        <h2>Написати повідомлення</h2>
        <p id="formNote" class="text-muted">
            Це навчальна форма. Повідомлення не надсилаються.
        </p>

        <form id="contactForm" aria-describedby="formNote">
            <div class="mb-3">
                <label for="name" class="form-label">Ваше ім’я</label>
                <input type="text" id="name" name="name"
                       class="form-control" autocomplete="name" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Електронна пошта</label>
                <input type="email" id="email" name="email"
                       class="form-control" autocomplete="email" required>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Повідомлення</label>
                <textarea id="message" name="message"
                          class="form-control" rows="5" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Надіслати
            </button>

            <p id="formResult" class="mt-3" role="status"></p>
        </form>
    </section>
</div>

<script>
    document.getElementById("contactForm").addEventListener("submit", function (event) {
        event.preventDefault();
        document.getElementById("formResult").textContent =
            "Форму заповнено коректно. Це демонстрація — повідомлення не надіслано.";
    });
</script>
{% endblock %}

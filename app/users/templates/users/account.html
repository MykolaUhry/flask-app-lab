{% extends "base.html" %}

{% block content %}
<div class="card card-body">
    <p>
        <strong>Ім’я користувача:</strong>
        {{ current_user.username }}
    </p>
    <p class="mb-0">
        <strong>Електронна пошта:</strong>
        {{ current_user.email }}
    </p>
</div>

<a href="{{ url_for('users.users_list') }}" class="btn btn-primary mt-3">
    Усі користувачі
</a>
{% endblock %}

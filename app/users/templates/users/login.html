{% extends "base.html" %}

{% block content %}
<section class="mx-auto" style="max-width: 450px;">
    <form method="post" action="{{ url_for('users.login') }}">
        <div class="mb-3">
            <label for="username" class="form-label">Логін</label>
            <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                autocomplete="username"
                required
            >
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary">Увійти</button>
    </form>
</section>
{% endblock %}

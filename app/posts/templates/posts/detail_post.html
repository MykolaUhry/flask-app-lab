{% extends "base.html" %}

{% block content %}
<div class="mb-3">
    <span class="badge bg-secondary">{{ post.category }}</span>

    {% if not post.is_active %}
        <span class="badge bg-warning text-dark">
            Прихований зі списку
        </span>
    {% endif %}
</div>

<p class="text-body-secondary">
    Автор: {{ post.author }} |
    {{ post.posted.strftime('%d.%m.%Y %H:%M') }} UTC
</p>

<div class="mb-4" style="white-space: pre-wrap; overflow-wrap: anywhere;">{{ post.content }}</div>

<div class="d-flex flex-wrap gap-2">
    <a href="{{ url_for('posts.post_update', post_id=post.id) }}"
       class="btn btn-primary">
        Редагувати
    </a>

    <a href="{{ url_for('posts.post_delete', post_id=post.id) }}"
       class="btn btn-danger">
        Видалити
    </a>

    <a href="{{ url_for('posts.post_list') }}"
       class="btn btn-outline-secondary">
        До списку
    </a>
</div>
{% endblock %}

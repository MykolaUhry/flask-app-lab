{% extends 'base.html' %}

{% block content %}
<div class="row g-4">
    {% for product in products %}
    <div class="col-md-4">
        <article class="card h-100 shadow-sm">
            <div class="card-body">
                <h2 class="h4">{{ product.name }}</h2>
                <p>Ціна: {{ product.price }}</p>

                <a href="{{ url_for('products.product_detail', product_id=product.id) }}"
                   class="btn btn-primary">
                    Детальніше
                </a>
            </div>
        </article>
    </div>
    {% endfor %}
</div>
{% endblock %}
